# Suba com `make up`, que roda o bootstrap antes de subir o container.

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: financas-bot
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      # Sem TZ o container roda em UTC e o cron dispara 3h adiantado.
      TZ: America/Sao_Paulo
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: 0.0.0.0

    env_file:
      - .env

    ports:
      # Só loopback: o dashboard expõe as chaves de API.
      - "127.0.0.1:${DASHBOARD_PORT:-9119}:9119"

    volumes:
      - ./data:/opt/data
      - ./skills/financas:/opt/data/skills/financas

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Notas de projeto (por que este arquivo difere do compose oficial do Hermes):
#
#   * Rede bridge com portas publicadas, não `network_mode: host` — host
#     networking não funciona no Docker Desktop, e o gateway do Telegram é só
#     tráfego de saída (long polling).
#   * Estado em ./data, não em ~/.hermes, para isolar este bot de outros agentes.
#   * A skill é montada de ./skills e fica versionada no git; sendo read-write,
#     melhorias que o próprio agente fizer aparecem como diff.
