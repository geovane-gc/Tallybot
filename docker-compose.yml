# Start with `make up`, which runs the bootstrap before bringing the container up.

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: tallybot
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      # Without TZ the container runs in UTC and cron fires three hours early.
      TZ: America/Sao_Paulo
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: 0.0.0.0

    env_file:
      - .env

    ports:
      # Loopback only: the dashboard exposes API keys.
      - "127.0.0.1:${DASHBOARD_PORT:-9119}:9119"

    volumes:
      - ./data:/opt/data
      - ./skills/finance:/opt/data/skills/finance

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Design notes — why this file differs from the official Hermes compose:
#
#   * Bridge networking with published ports rather than `network_mode: host`:
#     host networking does not work on Docker Desktop, and the Telegram gateway
#     is outbound-only (long polling).
#   * State lives in ./data, not ~/.hermes, isolating this bot from other agents.
#   * The skill is mounted from ./skills and stays versioned in git; being
#     read-write, any improvement the agent makes to it shows up as a diff.
