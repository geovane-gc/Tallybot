# Source of truth for the Hermes configuration. The bootstrap copies this file
# to data/config.yaml, which is what the container reads — edit here, not there.
#
# Any key left out inherits the Hermes default.

# Without this key the migrator treats the file as pre-v12 and refuses to migrate.
_config_version: 33

model:
  # Id verified against the OpenRouter API, not the docs (which mention an older
  # `nvidia/nemotron-3-ultra:free` variant). The `:free` suffix is what keeps the
  # calls at no cost.
  #
  # This model has no vision. To read a photo of a receipt, swap in
  # google/gemma-4-31b-it:free (tools + vision) and run `make restart`.
  default: "nvidia/nemotron-3-ultra-550b-a55b:free"
  provider: "openrouter"

agent:
  # The Hermes default is 500. On OpenRouter's free tier every iteration spends
  # one request from the daily quota, and logging an expense takes 2 or 3 — 500
  # would burn a whole day on a single message.
  max_turns: 30
  gateway_timeout: 600

# Recommended by the docs for an unattended gateway; the default is false, which
# suits interactive sessions where somebody reads the warnings.
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 4
    idempotent_no_progress: 4

# A lean list instead of the `hermes-telegram` preset, which brings browser,
# image_gen, tts, vision and web. Every tool costs definition tokens on every
# turn.
platform_toolsets:
  telegram:
    - terminal
    - skills
    - memory
    - cronjob

platforms:
  telegram:
    reply_to_mode: "off"
    guest_mode: false

terminal:
  # The container is already the sandbox; the docker backend would nest a
  # container inside a container for nothing.
  backend: "local"

# A text-only bot. The default provider is local faster-whisper, which would
# download ~150 MB on the first voice message. To enable audio: `enabled: true`
# and `make restart` — local transcription is free, no API key needed.
stt:
  enabled: false
  language: "pt"

compression:
  enabled: true

skills:
  # SKILL.md relies on ${HERMES_SKILL_DIR} being substituted.
  template_vars: true
  # Inline !`cmd` snippets would run without approval, and we do not need them.
  inline_shell: false
